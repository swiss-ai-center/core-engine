[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "common-code @ git+https://github.com/swiss-ai-center/common-code.git@887e8beb9625bd78d927a7c0ebe48985a2af4dca",
    "aiobotocore>=2.26.0,<3.0.0",
    "alembic~=1.18.5",
    "fastapi~=0.135.4",
    "httpx~=0.28.1",
    "jinja2~=3.1.6",
    "makefun~=1.16.0",
    "pg8000~=1.31.5",
    "psycopg2-binary~=2.9.12",
    "pydantic_settings>=2.14.2,<3.0.0",
    "python-multipart~=0.0.32",
    "requests~=2.34.2",
    "sentry-sdk[fastapi]~=1.45.1",
    "sqlmodel~=0.0.39",
    "uvicorn~=0.41.0",
    "websockets~=16.1.1",
    "fastapi-users[sqlalchemy]>=15.0.5",
    "aiosqlite>=0.22.1",
    "asyncpg>=0.31.0",
]

[tool.uv.sources]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "coverage~=7.15.2",
    "docker~=7.2.0",
    "flake8~=7.3.0",
    "pytest~=9.1.1",
    "pytest-asyncio~=1.4.0",
    "pytest-cov~=7.1.0",
    "pytest_httpserver~=1.1.5",
    "testcontainers-core~=0.0.1rc1",
    "testcontainers-minio~=0.0.1rc1",
    "testcontainers-postgres~=0.0.1rc1",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
addopts = "--cov-config=.coveragerc --cov-report xml --cov-report term-missing --cov=./src"
