apiVersion: v1
kind: Secret
metadata:
  name: core-engine-backend-secret
  labels:
    app: core-engine-backend
type: Opaque
stringData:
  # Secret used to sign authentication tokens (JWT). REQUIRED: the backend
  # refuses to start without it. Generate a strong random value with:
  #   openssl rand -hex 32
  AUTH_SECRET: "changeme-generate-with-openssl-rand-hex-32"

  # First admin bootstrap: created at startup if this email does not exist
  # yet. Optional: leave commented to skip the bootstrap. The password is
  # provided already hashed (never in clear text); generate the hash with:
  #   uv run python -c "from fastapi_users.password import PasswordHelper; import getpass; print(PasswordHelper().hash(getpass.getpass()))"

  ADMIN_EMAIL: "admin@swiss-ai-center.ch"
  ADMIN_PASSWORD_HASH: "$argon2id$v=19$m=65536,t=3,p=4$..."
